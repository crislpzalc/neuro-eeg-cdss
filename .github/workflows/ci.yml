name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/

      - name: Run tests
        run: |
          pytest tests/ \
            --ignore=tests/test_segmenter.py \
            --ignore=tests/test_labeler.py \
            --ignore=tests/test_feature_extraction.py \
            --ignore=tests/test_dataset_builder.py \
            --ignore=tests/test_dataset_builder_v2.py \
            --ignore=tests/test_feature_dataset_builder.py \
            -v --tb=short
        env:
          PYTHONPATH: src
